spring.application.name=hospital-management

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ClinicDb;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:StrongPass@123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
logging.level.com.zaxxer.hikari=DEBUG
server.port=8081
spring.data.web.pageable.max-page-size=50
clinic.time-zone=Asia/Kolkata