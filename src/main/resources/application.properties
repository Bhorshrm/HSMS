spring.application.name=hospital-management

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ClinicDb;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:hsms_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect